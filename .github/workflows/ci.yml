name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run lint:pipeline

      # Build-time placeholders. The build loads the Firebase Admin module
      # (lib/firebase-admin.ts initialises at import) and reads the public
      # client config, so these must exist; none of them is a real
      # credential, the key is generated fresh per run, and nothing here
      # talks to Firebase.
      - name: Throwaway Firebase config for the build
        run: |
          {
            echo "FIREBASE_ADMIN_PROJECT_ID=ci-build"
            echo "FIREBASE_ADMIN_CLIENT_EMAIL=ci-build@ci-build.iam.gserviceaccount.com"
            echo "FIREBASE_ADMIN_PRIVATE_KEY=$(openssl genrsa 2048 2>/dev/null | awk '{printf "%s\\n", $0}')"
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=ci-build-api-key"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-build.firebaseapp.com"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-build"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-build.appspot.com"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=0"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:0:web:0"
          } >> "$GITHUB_ENV"

      # Route types are generated during the build, so typecheck runs after it
      # rather than against whatever .next/types a previous run left behind.
      - run: npm run build
        env:
          # Build-time only. No real credential is needed to compile, and no
          # network call is made with these.
          PUBLIC_BASE_URL: https://example.test

      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Build-time placeholders. The build loads the Firebase Admin module
      # (lib/firebase-admin.ts initialises at import) and reads the public
      # client config, so these must exist; none of them is a real
      # credential, the key is generated fresh per run, and nothing here
      # talks to Firebase.
      - name: Throwaway Firebase config for the build
        run: |
          {
            echo "FIREBASE_ADMIN_PROJECT_ID=ci-build"
            echo "FIREBASE_ADMIN_CLIENT_EMAIL=ci-build@ci-build.iam.gserviceaccount.com"
            echo "FIREBASE_ADMIN_PRIVATE_KEY=$(openssl genrsa 2048 2>/dev/null | awk '{printf "%s\\n", $0}')"
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=ci-build-api-key"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-build.firebaseapp.com"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-build"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-build.appspot.com"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=0"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:0:web:0"
          } >> "$GITHUB_ENV"

      - run: npm run build
        env:
          PUBLIC_BASE_URL: https://example.test

      # playwright.config.ts starts `npm run start` itself and tears it down.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
